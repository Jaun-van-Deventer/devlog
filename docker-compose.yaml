services:
  mongodb:
    image: mongo:7
    container_name: devlog-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-devlog}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-devlog}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-devlog}
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: node:25-alpine
    container_name: devlog-backend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-devlog}:${MONGO_INITDB_ROOT_PASSWORD:-devlog}@mongodb:27017/${MONGO_INITDB_DATABASE:-devlog}?authSource=admin
      MONGODB_DB_NAME: ${MONGO_INITDB_DATABASE:-devlog}
      PORT: ${PORT:-5000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules

volumes:
  mongodb-data:
  backend-node-modules:
